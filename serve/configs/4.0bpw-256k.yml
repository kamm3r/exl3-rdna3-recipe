# Qwen3.8-27B EXL3 4.0 bpw on one RX 7900 XTX (24 GB): 256K context, 4-bit KV cache, MTP draft, vision.
# Start with: serve/run.sh 4.0bpw-256k
# Paths are relative to tabbyAPI/ (serve/run.sh starts the server from there).
network:
  host: 127.0.0.1
  port: 5000
  disable_auth: true
  allowed_origins: []

logging:
  log_prompt: false
  log_requests: false

model:
  model_dir: ../models
  model_name: Qwen3.8-27B-exl3-SC4.0
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 262144
  # 4-bit keys and values: an 8-bit or 6-bit cache at 256K leaves less than 1.5 GB free with a desktop on the card.
  cache_mode: 4,4
  max_batch_size: 1
  chunk_size: 2048
  vision: true
  vision_offload: true
  reasoning: true
  tool_format: qwen3_coder

draft_model:
  draft_mode: mtp
  # The model has one MTP layer; drafting 3 tokens instead of the default 4 measured ~9% faster decode here.
  draft_num_tokens: 3
